        const IDS = {"left":"20261031_041539_0c28e75d-625c-458f-8856-6b453a928025","closed":"20261031_041538_8fc82176-77a6-4184-8f32-945745b2f221","shock":"20261031_041539_ee462c23-6248-4ef8-83d4-807441048b67","tongue":"20261031_041539_75259b31-bca1-4dcd-adb9-31a25fa07a11","right":"20261031_041648_92b934ff-4d25-4e28-972f-cef1e88f054f","downleft":"20261031_041648_94ec5df2-86e4-481d-a104-6604cd3ee36b","upright":"20261031_041648_8de72dda-4c29-4d52-a259-acb682b21567","up":"20261031_041648_736f4839-4571-4677-898f-c5f64bfeb525","downright":"20261031_041649_eed87373-0d0c-4401-ab76-ad8da40421d3","down":"20261031_041649_143660e6-f71a-4874-b97f-fb8890d5b1a1","half":"20261031_041704_053e92a5-721a-4f93-86d8-631c1b8ea31a","cross":"20261031_041705_dc163465-5cfa-40c1-8c43-76c5deb789a0","angry":"20261031_041706_bc89f0b6-438d-46fc-86bd-d3ae08b1a561","scrunch":"20261031_041706_87b48b08-cc37-4278-96c2-8ac49d48a165","winkr":"20261031_041705_f622e78c-2c3d-4635-b4ac-bab0e5b2862a","winkl":"20261031_041705_df901488-4988-4b29-9517-44d417ead6f2","raised":"20261031_041705_53d6bed3-91ae-47f4-a306-6615fc30c3a7","puff":"20261031_041721_69a2bd4b-a663-4638-9fe1-952d640726e5","laugh":"20261031_041722_402f7a03-a57c-418c-a513-65d5ee89aecf","yawn":"20261031_041726_3ccd0f66-112a-408b-870d-84a73b907211","grin":"20261031_041722_14bedc29-1d7e-407f-800c-f8a584be9743","kiss":"20261031_041722_c9dfa379-7ad7-469a-a7a1-2207ea3b2132","cry":"20261031_041725_ab6d29ed-9c51-4d18-9a19-15161a42b914","smug":"20261031_041726_941343db-f191-42e2-a20d-76471622963b","scared":"20261031_041742_76d19aad-5f53-4657-bda1-ed0ba07d0919","fish":"20261031_041738_1b8b311f-0b80-4014-9301-f855cadf7775","blue":"20261031_041743_0d2ae3ce-1ef4-4e25-bde2-f850d836a452","dizzy":"20261031_041739_d2d94cc6-c8a8-4948-b160-433b4ee8d335","blonde":"20261031_041745_54be8d58-68ad-4cdc-b894-57f3820521fc","pink":"20261031_041742_b07d9eeb-d0c2-4684-bd82-dd0a34faae70","wind":"20261031_041748_a042c812-0a19-4c44-8e26-19ebba49d827","sse":"20261031_041847_06cd56a3-85a3-428f-9761-40f0455fea28","nnw":"20261031_041848_c954304f-6a0f-40e7-90a7-61e760ec3217","ese":"20261031_041848_cf01800b-186c-4534-b3fa-839000a9ab40","ene":"20261031_041848_5baf5c75-5af4-43cc-9e36-6d5bb7268cc9","wnw":"20261031_041848_9b609e34-57f0-47f0-a733-270f3d487766","ssw":"20261031_041848_08ae5fa2-0ba2-43b3-948c-dcde293d6957","wsw":"20261031_041849_84482741-9730-4a28-be2f-e85c04206a2d","ouch":"20261031_041903_1df48a13-6d25-42e4-9666-f762bc338f2a","deadpan":"20261031_041904_18bc71c8-d88a-4c12-9e43-82b8ac222b00","yawn1":"20261031_041904_3b68d48d-633a-4761-9af7-e574da308039","yawn2":"20261031_041904_7027967a-59be-4eec-b6e1-6ec2255df748","whistle1":"20261031_041905_03626778-4a7a-4bd8-9136-658e44c36fe3","nne":"20261031_041903_73a000c6-37b6-48a1-a60a-628954160c41","yawn4":"20261031_041905_66ce2f38-8e7d-4ade-b678-9020af378b08","sneeze1":"20261031_041920_d4fee90e-7fb7-43ff-b378-bc549653f68d","gum1":"20261031_041921_3c249ba4-f88e-49f5-b985-c7380ec5c91a","gum2":"20261031_041922_8d65cee5-5d05-4c89-a3c9-8a397c060e04","whistle2":"20261031_041920_ba051a0a-45bb-4004-b0e6-73d2cd519d71","sneeze2":"20261031_041920_f30e74cb-21f3-4f11-8b9d-e4a1f469307e","gum3":"20261031_041923_a427c4d9-f78a-41e5-acd6-91adc3c79025","gumpop":"20261031_041926_358ed853-58d5-45c0-bcb6-f052169c6f2d","hearts":"20261031_041938_b3929b4d-e3d9-4e5d-8cd0-7ec8ef5248ba","stars":"20261031_041940_4128a9d8-9ce2-4b51-a8b7-84cdcb0b4f12","snore":"20261031_041936_e5a6759e-7dd8-4425-a913-98ac6633603f","shy":"20261031_041937_7f0eff0c-37ce-4d0c-9f5d-547d75e45e93","sick":"20261031_041941_59aa6c28-2fc5-40d7-bb9a-699fd8539d59","rest":"20261031_040619_2f6f349e-a4a7-40db-8e9b-03b6acd8b99a"};

        // sixteen gaze directions plus half and closed lids: each is a whole picture of her, swapped like any other face
        const RING = ['e', 'ene', 'ne', 'nne', 'n', 'nnw', 'nw', 'wnw', 'w', 'wsw', 'sw', 'ssw', 's', 'sse', 'se', 'ese'];
        const EYEFILE = {e: 'right', ene: 'ene', ne: 'upright', nne: 'nne', n: 'up', nnw: 'nnw', nw: 'wnw', wnw: 'wnw', w: 'left', wsw: 'wsw', sw: 'downleft', ssw: 'ssw', s: 'down', sse: 'sse', se: 'downright', ese: 'ese', half: 'half', closed: 'closed'};
        const HAIRS = ['pink', 'blue', 'blonde'];

        const OVER = 1.7, N = 72, M = N + 1, SPAN = OVER / N, ORIGIN = .5 - OVER / 2;
        const WOBBLE = 2.3 * 2 * Math.PI, REACH = .085 / SPAN, C = REACH * WOBBLE, GAMMA = 2 * .14 * WOBBLE, NU = .2 * C;

        const gl = canvas.getContext('webgl', {alpha: true, premultipliedAlpha: true, antialias: true});
        if (!gl) return;
        window.__faceEngine = true;
        const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;

        const VS = `attribute vec2 a, d; attribute float s; varying vec2 vUv; varying float vS;
          uniform vec2 lean; uniform float overS;
          void main(){ vUv = a; vS = s; vec2 p = a + d + lean; gl_Position = vec4(vec2(p.x-.5, .5-p.y)*2./overS, 0., 1.); }`;
        const FS = `precision highp float; varying vec2 vUv; varying float vS;
          uniform sampler2D faceA, faceB;
          uniform float fade, sharp;
          void main(){
            if(vUv.x<0.||vUv.y<0.||vUv.x>1.||vUv.y>1.){ gl_FragColor = vec4(0.); return; }
            vec4 A = texture2D(faceA,vUv), B = texture2D(faceB,vUv);
            float w = fade;
            if(sharp > 0.){
              // where the two pictures really differ (a brow, iris or lip that moved) swap through the midpoint instead of
              // showing both at half strength: that double exposure is what reads as a broken, ghosted eyebrow
              float d = length(A.rgb - B.rgb) + abs(A.a - B.a);
              w = mix(fade, smoothstep(.47, .53, fade), smoothstep(.06, .24, d) * sharp);
            }
            vec4 c = mix(A, B, w);
            if(c.a<.004){ gl_FragColor = vec4(0.); return; }
            gl_FragColor = vec4(c.rgb*vS, c.a);
          }`;
        const sh = (t, s) => { const o = gl.createShader(t); gl.shaderSource(o, s); gl.compileShader(o); if (!gl.getShaderParameter(o, gl.COMPILE_STATUS)) console.error(gl.getShaderInfoLog(o)); return o; };
        const pr = gl.createProgram();
        gl.attachShader(pr, sh(gl.VERTEX_SHADER, VS)); gl.attachShader(pr, sh(gl.FRAGMENT_SHADER, FS));
        gl.linkProgram(pr); gl.useProgram(pr);
        const U = {over_: gl.getUniformLocation(pr, 'overS')};
        for (const n of ['lean', 'faceA', 'faceB', 'fade', 'sharp']) U[n] = gl.getUniformLocation(pr, n);
        gl.uniform1f(U.over_, OVER);
        gl.uniform1i(U.faceA, 0); gl.uniform1i(U.faceB, 1); 

        // ---- the sheet: a damped wave equation on the displacement of each node ----
        const count = M * M, ux = new Float32Array(count), uy = new Float32Array(count), vx = new Float32Array(count), vy = new Float32Array(count);
        const rest = new Float32Array(count * 2), dyn = new Float32Array(count * 3);
        const sx = new Float32Array(count), sy = new Float32Array(count);
        for (let j = 0, k = 0; j < M; j++) for (let i = 0; i < M; i++) { rest[k++] = ORIGIN + i * SPAN; rest[k++] = ORIGIN + j * SPAN; }
        const idx = new Uint16Array(N * N * 6);
        for (let j = 0, k = 0; j < N; j++) for (let i = 0; i < N; i++) { const a = j * M + i, b = a + 1, c = a + M, d = c + 1; idx[k++] = a; idx[k++] = c; idx[k++] = b; idx[k++] = b; idx[k++] = c; idx[k++] = d; }
        gl.bindBuffer(gl.ARRAY_BUFFER, gl.createBuffer()); gl.bufferData(gl.ARRAY_BUFFER, rest, gl.STATIC_DRAW);
        const aa = gl.getAttribLocation(pr, 'a'); gl.enableVertexAttribArray(aa); gl.vertexAttribPointer(aa, 2, gl.FLOAT, false, 0, 0);
        const dynBuf = gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER, dynBuf); gl.bufferData(gl.ARRAY_BUFFER, dyn, gl.DYNAMIC_DRAW);
        const ad = gl.getAttribLocation(pr, 'd'), as = gl.getAttribLocation(pr, 's');
        gl.enableVertexAttribArray(ad); gl.vertexAttribPointer(ad, 2, gl.FLOAT, false, 12, 0);
        gl.enableVertexAttribArray(as); gl.vertexAttribPointer(as, 1, gl.FLOAT, false, 12, 8);
        gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER, gl.createBuffer()); gl.bufferData(gl.ELEMENT_ARRAY_BUFFER, idx, gl.STATIC_DRAW);
        gl.enable(gl.BLEND); gl.blendFunc(gl.ONE, gl.ONE_MINUS_SRC_ALPHA); gl.clearColor(0, 0, 0, 0);

        // a handful of skin: nodes near the point follow the hand, fully at the centre
        let brush = null;
        function takeHold(u, v, radius = .22) {
          const list = [];
          for (let k = 0; k < count; k++) {
            const dx = rest[k * 2] + ux[k] - u, dy = rest[k * 2 + 1] + uy[k] - v, w = Math.exp(-(dx * dx + dy * dy) / (radius * radius));
            if (w > .02) list.push([k, w, ux[k], uy[k]]);
          }
          brush = {u, v, list, px: 0, py: 0};
        }
        // Pairwise mesh constraints: neighboring vertices can squash but never invert/overlap
        const restX = new Float32Array(count), restY = new Float32Array(count);
        for (let k = 0; k < count; k++) { restX[k] = rest[k * 2]; restY[k] = rest[k * 2 + 1]; }
        function untangle() {
          const minGap = SPAN * 0.25;
          // Row pass: prevent neighboring vertices along x from inverting or overlapping
          for (let j = 0; j < M; j++) {
            const row = j * M;
            for (let i = 0; i < N; i++) {
              const k1 = row + i, k2 = k1 + 1;
              const dist = (restX[k2] + sx[k2]) - (restX[k1] + sx[k1]);
              if (dist < minGap) {
                const push = (minGap - dist) * 0.5;
                sx[k1] = Math.max(-0.2, sx[k1] - push);
                sx[k2] = Math.min(0.2, sx[k2] + push);
              }
            }
          }
          // Column pass: prevent neighboring vertices along y from inverting or overlapping
          for (let i = 0; i < M; i++) {
            for (let j = 0; j < N; j++) {
              const k1 = j * M + i, k2 = (j + 1) * M + i;
              const dist = (restY[k2] + sy[k2]) - (restY[k1] + sy[k1]);
              if (dist < minGap) {
                const push = (minGap - dist) * 0.5;
                sy[k1] = Math.max(-0.2, sy[k1] - push);
                sy[k2] = Math.min(0.2, sy[k2] + push);
              }
            }
          }
        }

        const H = 1 / 240; let simLeft = 0;
        function step(dt) {
          const c2 = C * C, wo2 = WOBBLE * WOBBLE;
          for (let j = 1; j < N; j++) for (let i = 1; i < N; i++) {
            const k = j * M + i, l = k - 1, r = k + 1, t = k - M, b = k + M;
            const lx = ux[l] + ux[r] + ux[t] + ux[b] - 4 * ux[k], ly = uy[l] + uy[r] + uy[t] + uy[b] - 4 * uy[k];
            const lvx = vx[l] + vx[r] + vx[t] + vx[b] - 4 * vx[k], lvy = vy[l] + vy[r] + vy[t] + vy[b] - 4 * vy[k];
            vx[k] += (c2 * lx - wo2 * ux[k] - GAMMA * vx[k] + NU * lvx) * dt;
            vy[k] += (c2 * ly - wo2 * uy[k] - GAMMA * vy[k] + NU * lvy) * dt;
          }
          if (brush) for (const [k, w, u0, v0] of brush.list) {
            const K = 2200 * w, D = 80 * w;
            vx[k] += ((u0 + brush.px * w - ux[k]) * K - vx[k] * D) * dt;
            vy[k] += ((v0 + brush.py * w - uy[k]) * K - vy[k] * D) * dt;
          }
          const MAX_V = 0.9, MAX_U = 0.18;
          for (let k = 0; k < count; k++) {
            if (!isFinite(vx[k])) vx[k] = 0;
            if (!isFinite(vy[k])) vy[k] = 0;
            if (!isFinite(ux[k])) ux[k] = 0;
            if (!isFinite(uy[k])) uy[k] = 0;

            if (vx[k] > MAX_V) vx[k] = MAX_V; else if (vx[k] < -MAX_V) vx[k] = -MAX_V;
            if (vy[k] > MAX_V) vy[k] = MAX_V; else if (vy[k] < -MAX_V) vy[k] = -MAX_V;

            ux[k] += vx[k] * dt;
            uy[k] += vy[k] * dt;

            // Continuous damping decay to rest to permanently prevent resonance accumulation
            ux[k] *= 0.998;
            uy[k] *= 0.998;
            vx[k] *= 0.998;
            vy[k] *= 0.998;

            if (ux[k] > MAX_U) { ux[k] = MAX_U; vx[k] *= 0.2; }
            else if (ux[k] < -MAX_U) { ux[k] = -MAX_U; vx[k] *= 0.2; }

            if (uy[k] > MAX_U) { uy[k] = MAX_U; vy[k] *= 0.2; }
            else if (uy[k] < -MAX_U) { uy[k] = -MAX_U; vy[k] *= 0.2; }
          }

          // Pin boundary edges
          for (let i = 0; i < M; i++) {
            const top = i, btm = N * M + i, lft = i * M, rgt = i * M + N;
            ux[top] = uy[top] = vx[top] = vy[top] = 0;
            ux[btm] = uy[btm] = vx[btm] = vy[btm] = 0;
            ux[lft] = uy[lft] = vx[lft] = vy[lft] = 0;
            ux[rgt] = uy[rgt] = vx[rgt] = vy[rgt] = 0;
          }
        }
        // a shove from nowhere: sneezes, jolts, a fly landing
        function poke(u, v, dx, dy, radius = .09) {
          const mag = Math.hypot(dx, dy);
          if (mag > 0.2) {
            const s = 0.2 / mag;
            dx *= s;
            dy *= s;
          }
          for (let k = 0; k < count; k++) {
            const ax = rest[k * 2] - u, ay = rest[k * 2 + 1] - v;
            const d2 = ax * ax + ay * ay;
            if (d2 > radius * radius * 4) continue;
            const w = Math.exp(-d2 / (radius * radius));
            vx[k] += dx * w; vy[k] += dy * w;
          }
        }

        // ---- pictures ----
        const tex = {};
        const param = () => { gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE); gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE); gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR); gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR); };
        gl.pixelStorei(gl.UNPACK_PREMULTIPLY_ALPHA_WEBGL, true);
        const load = name => new Promise(res => { const i = new Image(); i.crossOrigin = 'anonymous'; i.onload = () => res(i); i.onerror = () => res(null); i.src = url(IDS[name]); });
        function upload(name, img) {
          if (!gl || !img) return;
          if (tex[name]) {
            try { gl.deleteTexture(tex[name]); } catch (_) {}
          }
          const t = gl.createTexture();
          gl.activeTexture(gl.TEXTURE5);
          gl.bindTexture(gl.TEXTURE_2D, t);
          gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, img);
          param();
          tex[name] = t;
        }

        function hitMap(img) {
          const a = document.createElement('canvas'); a.width = a.height = 128;
          const ac = a.getContext('2d', {willReadFrequently: true}); ac.drawImage(img, 0, 0, 128, 128);
          alphaMap = ac.getImageData(0, 0, 128, 128).data;
        }

        // ---- what she does ----
        // Where this character's features sit relative to Mina's (identity for Mina). Touch zones, prop positions and the gaze
        // target are all defined in Mina's coordinates; toRef/fromRef map between the two so they follow any face.
        const FACE = {cx: .5, eyeV: .455, kx: 1, ky: 1};
        const toRef = (u, v) => [.5 + (u - FACE.cx) / FACE.kx, .455 + (v - FACE.eyeV) / FACE.ky];
        const fromRef = (u, v) => [FACE.cx + (u - .5) * FACE.kx, FACE.eyeV + (v - .455) * FACE.ky];
        let SPOT;
        const setLayout = l => {
          FACE.cx = (l && l.cx) || .5; FACE.eyeV = (l && l.eyeV) || .455; FACE.kx = (l && l.kx) || 1; FACE.ky = (l && l.ky) || 1;
          SPOT = {nose: fromRef(.5, .54), brow: fromRef(.5, .34), cheekR: fromRef(.66, .57), cheekL: fromRef(.34, .57), mouth: fromRef(.505, .645)};
          if (glasses) glasses.style.width = FACE.kx === 1 ? '' : (34 * FACE.kx) + '%';
        };
        setLayout();
        // [picture or eye cell, crossfade ms, hold ms, extras]
        const ACTS = {
          yawn: [['yawn1', 140, 240], ['yawn2', 140, 200], ['yawn', 170, 900], ['yawn2', 150, 130], ['yawn4', 180, 700]],
          whistle: [['whistle1', 150, 700], ['whistle2', 100, 700], ['whistle1', 100, 620], ['whistle2', 100, 620]],
          shifty: [['eye:w', 60, 520], ['eye:e', 60, 600], ['eye:w', 60, 400], ['eye:rest', 60, 260]],
          roll: [['eye:w', 70, 200], ['eye:wnw', 50, 55], ['eye:nw', 50, 55], ['eye:nnw', 50, 60], ['eye:n', 50, 140], ['eye:nne', 50, 60], ['eye:ne', 50, 55], ['eye:ene', 50, 55], ['eye:e', 50, 240], ['eye:rest', 90, 200], ['deadpan', 120, 700]],
          sneeze: [['sneeze1', 130, 380], ['half', 90, 120], ['sneeze1', 90, 560], ['sneeze2', 50, 300, {jolt: [.5, .6, 0, .25, .34], lean: [0, .03]}], ['dizzy', 110, 620], ['shy', 140, 650]],

          // acts when the page goes quiet
          if (act) {
            if (now - actT > actHold) advance(now);
          } else if ((showMode || !reduced) && !pressed && tStart && (showMode
            ? now - lastActEnd > (customMode ? 1500 : 380)
            : (now - lastPointerMove > (customMode ? 3500 : 4000)) && (now - lastActEnd > nextIdleActDelay))) {
            startAct(nextAct(), now);
            if (!awake) wake(now);
          }

          // moving props
          const mk = Math.min(1, (now - moveT) / moveMs), me = mk * mk * (3 - 2 * mk);
          flyPos = [flyFrom[0] + (flyTo[0] - flyFrom[0]) * me + Math.sin(now * .02) * .012 * (1 - (mk >= 1 ? .85 : 0)), flyFrom[1] + (flyTo[1] - flyFrom[1]) * me + Math.cos(now * .027) * .012 * (1 - (mk >= 1 ? .85 : 0))];
          place(fly, flyPos[0], flyPos[1]);
          const hp = [handFrom[0] + (handTo[0] - handFrom[0]) * me, handFrom[1] + (handTo[1] - handFrom[1]) * me];
          place(hand, hp[0], hp[1]);
          if (activeProp) {
            const wx = propWobble ? Math.sin(now * .014) * .016 * (1 - (mk >= 1 ? .7 : 0)) : 0;
            const wy = propWobble ? Math.cos(now * .019) * .016 * (1 - (mk >= 1 ? .7 : 0)) : 0;
            propPos = [
              propFrom[0] + (propTo[0] - propFrom[0]) * me + wx,
              propFrom[1] + (propTo[1] - propFrom[1]) * me + wy,
            ];
            place(activeProp, propPos[0], propPos[1]);
          }
          if (handGrip === 'on' && !handHeld) { takeHold(hp[0], hp[1], .22); handHeld = true; hand.classList.add('shut'); handGrip = 'pull'; }
          if (handHeld && brush) { brush.px = hp[0] - brush.u; brush.py = hp[1] - brush.v; }
          if (handGrip === 'off' && handHeld) { handHeld = false; brush = null; hand.classList.remove('shut'); handGrip = false; }

          // which picture
          let want = 'rest';
          const pull = brush ? Math.hypot(brush.px, brush.py) : 0;
          if (act) want = null;
          else if (pressed) want = pull > .24 ? 'scared' : pull > .1 ? 'ouch' : pull > .02 || zoneAt(downU, downV) !== 'hair' ? 'shock' : 'rest';
          else if (moodFace && now < moodUntil) want = moodFace;
          else if (shake > .55) want = shake > .92 ? 'sick' : 'wind';
          else if (zone && now - zoneSince > 80 && ZONES.hover[zone]) want = ZONES.hover[zone];
          if (want) setFace(want, want === 'rest' ? 110 : 90, now);

          // eyes: only over the resting face, and they go shut when she is left alone
          const neutral = logical === 'rest';
          if (neutral) {
            if (wantEyes) setEye(wantEyes, 60, now);
            else if (!awake) setEye('closed', 200, now);
            else if (blinkStep >= 0) {
              if (tex.blink25 && tex.blink75) {
                const s = (now - blinkT) / 34 | 0;
                if (s !== blinkStep) {
                  blinkStep = s;
                  if (s === 0) setEye('blink25', 18, now);
                  else if (s === 1) setEye('half', 18, now);
                  else if (s === 2) setEye('blink75', 18, now);
                  else if (s === 3) setEye('closed', 22, now);
                  else if (s === 4) setEye('blink75', 18, now);
                  else if (s === 5) setEye('half', 18, now);
                  else if (s === 6) setEye('blink25', 18, now);
                  else blinkStep = -1;
                }
              } else {
                const s = (now - blinkT) / 62 | 0;
                if (s !== blinkStep) { blinkStep = s; if (s === 0) setEye('half', 20, now); else if (s === 1) setEye('closed', 20, now); else if (s === 2) setEye('half', 20, now); else blinkStep = -1; }
              }
            } else {
              let target;
              if (lookAt) { const p = toRef(...lookAt()); target = [p[0] - .5, p[1] - .46]; }
              else if (now < scrollUntil) target = [0, 1];
              else if (now - lastPointerMove > 4000) target = [0, 0];
              else { const p = toRef(pu, pv); target = [p[0] - .5, p[1] - .46]; }
              const dist = Math.hypot(target[0], target[1]);
              const rCell = ringFor(target[0], target[1]);
              setEye(dist < .075 ? 'rest' : (dist < .19 && tex['near_' + (EYEFILE[rCell] || rCell)] ? 'near_' + rCell : rCell), 45, now);
              if (now > nextBlink) { blinkStep = 0; blinkT = now; setEye(tex.blink25 ? 'blink25' : 'half', 18, now); nextBlink = now + 2200 + Math.random() * 3400; }
            }
          }

          compose(now);
          // the head leans toward the pull, the cursor, and whatever the act asks
          const isStill = now - lastPointerMove > 4000;
          const tx = (pressed || handHeld ? (brush ? brush.px * .16 : 0) : (awake && !isStill) ? (pu - .5) * .012 : 0) + wantLean[0] + Math.sin(now * .0009) * .0015;
          const ty = (pressed || handHeld ? (brush ? brush.py * .16 : 0) : (awake && !isStill) ? (pv - .46) * .008 : 0) + wantLean[1] + Math.sin(now * .0013) * .0022;
          lvX += ((tx - leanX) * 70 - lvX * 8) * dt; lvY += ((ty - leanY) * 70 - lvY * 8) * dt;
          leanX += lvX * dt; leanY += lvY * dt;

          // skin
          simLeft += dt;
          let steps = 0;
          while (simLeft >= H && steps < 8) { step(H); simLeft -= H; steps++; }
          if (steps === 8) simLeft = 0;
          for (let j = 0; j < M; j++) for (let i = 0; i < M; i++) {
            const k = j * M + i, edge = i === 0 || j === 0 || i === N || j === N;
            sx[k] = edge ? 0 : (ux[k] * 4 + ux[k - 1] + ux[k + 1] + ux[k - M] + ux[k + M]) / 8;
            sy[k] = edge ? 0 : (uy[k] * 4 + uy[k - 1] + uy[k + 1] + uy[k - M] + uy[k + M]) / 8;
          }
          untangle();
          for (let k = 0, o = 0; k < count; k++) {
            const px = isFinite(sx[k]) ? sx[k] : 0;
            const py = isFinite(sy[k]) ? sy[k] : 0;
            dyn[o++] = px;
            dyn[o++] = py;
            const r = k % M, c = (k / M) | 0;
            let sh = 1;
            if (r > 0 && r < N && c > 0 && c < N) {
              const dx = (sx[k + 1] - sx[k - 1]) || 0;
              const dy = (sy[k + M] - sy[k - M]) || 0;
              sh = Math.max(.86, Math.min(1.16, 1 - (dx + dy) * 1.8));
            }
            dyn[o++] = isFinite(sh) ? sh : 1;
          }
          gl.bindBuffer(gl.ARRAY_BUFFER, dynBuf); gl.bufferSubData(gl.ARRAY_BUFFER, 0, dyn);

          gl.clear(gl.COLOR_BUFFER_BIT);
          gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D, tex[faceA] || tex.rest);
          gl.activeTexture(gl.TEXTURE1); gl.bindTexture(gl.TEXTURE_2D, tex[faceB] || tex.rest);
          gl.uniform1f(U.fade, Math.min(1, (now - fadeT) / fadeMs));
          gl.uniform1f(U.sharp, customMode ? 1 : 0);
          gl.uniform2f(U.lean, leanX, leanY);
          gl.drawElements(gl.TRIANGLES, idx.length, gl.UNSIGNED_SHORT, 0);
        }

        let customModeVersion = 0;

        (async () => {
          const base = await load('rest');
          if (!base || customModeVersion !== 0) return;
          upload('rest', base); hitMap(base);
          const fallback = document.getElementById('faceFallback');
          if (fallback) fallback.style.visibility = 'hidden';
          ready = true; tStart = performance.now(); requestAnimationFrame(frame);
          const take = async n => {
            const img = await load(n);
            if (img && customModeVersion === 0) upload(n, img);
          };
          await take('closed'); await take('half');
          const names = Object.keys(IDS).filter(n => !['rest', 'closed', 'half'].includes(n));
          let i = 0;
          await Promise.all(Array.from({length: 6}, async () => {
            while (i < names.length && customModeVersion === 0) await take(names[i++]);
          }));
        })();

        // Custom character integration hooks
        window.applyCustomTexture = function(name, imgElementOrCanvas) {
          if (!gl || !imgElementOrCanvas) return;
          upload(name, imgElementOrCanvas);
          if (name === 'rest') {
            hitMap(imgElementOrCanvas);
            faceA = 'rest';
            faceB = 'rest';
          }
        };

        window.applyCustomTexturePack = function(pack, layout) {
          if (!gl || !pack) return;
          customModeVersion++;
          rotation = [];
          endAct();
          hairI = -1;
          moodFace = null;
          setLayout(layout);

          // Purge all existing textures so no default Mina frame can ever bleed through
          for (const k of Object.keys(tex)) {
            try { gl.deleteTexture(tex[k]); } catch (_) {}
            delete tex[k];
          }

          for (const [name, img] of Object.entries(pack)) {
            if (img) upload(name, img);
          }

          if (pack.rest) {
            hitMap(pack.rest);
            const fallback = document.getElementById('faceFallback');
            if (fallback) {
              if (pack.rest.src) fallback.src = pack.rest.src;
              fallback.style.visibility = 'hidden';
            }
          }

          const now = performance.now();
          faceA = 'rest';
          faceB = 'rest';
          logical = 'rest';
          eyeNow = 'rest';
          fadeT = now;
          awake = true;
          lastPointerMove = now;
          lastActEnd = now;
          nextIdleActDelay = 3000;
          customMode = true;
          stopShow();
          if (!ready) {
            ready = true;
            tStart = now;
            requestAnimationFrame(frame);
          }
          // Subtle welcome bounce, then the new character introduces itself (the cursor can wander meanwhile)
          poke(0.5, 0.5, 0, -0.10, 0.24);
          const myVer = customModeVersion;
          setTimeout(() => {
            if (customModeVersion !== myVer || pressed) return;
            protectUntil = performance.now() + 5200;
            startAct('hello', performance.now());
          }, 700);
        };

        // "Show me everything": plays every idle act back to back until toggled off or the portrait is grabbed
        window.toggleLivingShow = function() {
          showMode = !showMode;
          protectUntil = 0;
          if (showMode) {
            wake(performance.now());
            startAct(nextAct(), performance.now());
          } else endAct();
          window.dispatchEvent(new CustomEvent('livingshow', {detail: {on: showMode}}));
          return showMode;
        };

        window.resetToDefaultMina = async function() {
          if (!gl) return;
          customModeVersion++;
          const myVer = customModeVersion;
          customMode = false;
          stopShow();
          protectUntil = 0;
          rotation = [];
          endAct();
          hairI = -1;
          moodFace = null;
          setLayout();

          const base = await load('rest');
          if (!base || customModeVersion !== myVer) return;

          for (const k of Object.keys(tex)) {
            try { gl.deleteTexture(tex[k]); } catch (_) {}
            delete tex[k];
          }

          upload('rest', base);
          hitMap(base);
          faceA = 'rest';
          faceB = 'rest';
          logical = 'rest';
          eyeNow = 'rest';
          poke(0.5, 0.5, 0, -0.10, 0.24);

          const takeOne = async n => {
            const img = await load(n);
            if (img && customModeVersion === myVer) upload(n, img);
          };
          await takeOne('closed');
          await takeOne('half');
          const names = Object.keys(IDS).filter(n => !['rest', 'closed', 'half'].includes(n));
          let i = 0;
          await Promise.all(Array.from({length: 6}, async () => {
            while (i < names.length && customModeVersion === myVer) await takeOne(names[i++]);
          }));
        };
      }

      window.initLivingPortrait = initLivingPortrait;
      if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', initLivingPortrait);
      } else {
        initLivingPortrait();
      }
    </script>
  </body>
</html>
